<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Signup Form</title>

    <style>
        body{
            font-family: Arial, sans-serif;
            background:#f4f4f4;
        }

        .container{
            width:350px;
            margin:50px auto;
            background:#fff;
            padding:20px;
            border-radius:8px;
            box-shadow:0 0 10px rgba(0,0,0,.2);
        }

        h2{
            text-align:center;
        }

        label{
            display:block;
            margin-top:15px;
        }

        input{
            width:100%;
            padding:8px;
            margin-top:5px;
            box-sizing:border-box;
        }

        button{
            width:100%;
            padding:10px;
            margin-top:20px;
            background:green;
            color:white;
            border:none;
            cursor:pointer;
        }

        button:hover{
            background:darkgreen;
        }

        #error{
            color:red;
            margin-top:10px;
        }

        #count{
            margin-top:15px;
            color:blue;
            font-weight:bold;
        }
    </style>
</head>
<body>

<div class="container">

    <h2>Signup Form</h2>

    <form id="signupForm">

        <label for="name">Full Name</label>
        <input type="text" id="name">

        <label for="phone">Phone Number</label>
        <input
            type="text"
            id="phone"
            placeholder="09XXXXXXXX or +2519XXXXXXXX">

        <button type="submit">Sign Up</button>

        <div id="error"></div>

    </form>

    <p id="count"></p>

</div>

<script src="app.js"></script>

</body>
</html>
